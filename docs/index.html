<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Quiz Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Big+Shoulders+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: lively host-led corporate quiz, big and readable on a projector
   IDEA: an airline boarding pass — each question is a flight to one of 7 countries
   PICTURE: the question card; the finale is NAL CLUSTER lettering filled with earned flags
   COLOUR and TYPE: charcoal-green ground, white passes, client green accent; Big Shoulders + DM Sans
   LAYOUT: one centred pass per screen, team score strip below */
:root{color-scheme:light dark;
--bg:light-dark(#13261d,#0a140f);--card:light-dark(#ffffff,#15241c);--ink:light-dark(#0f1c15,#eaf5ee);
--mute:light-dark(#5b6b62,#9fb3a7);--line:light-dark(#dfe8e2,#25392e);--acc:#3dcd58;--accd:#1f8f36;--ok:#16a34a;--on:#fff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,.big{font-family:"Big Shoulders Display",Impact,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
.wrap{max-width:1040px;margin:0 auto;padding:clamp(16px,3vw,40px) max(4vw,14px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--on);margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:40px;max-width:200px;object-fit:contain;background:#fff;border-radius:8px;padding:4px 8px}
.top h1{font-size:clamp(28px,4vw,40px);letter-spacing:.5px}
.host{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hb{border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:99px;padding:6px 14px;min-height:40px;font-weight:700}
.hb.on{background:var(--acc);color:#0f1c15;border-color:var(--acc)}
.hb:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:9}
.ov[hidden]{display:none}
.ov .pass{width:min(560px,100%);max-height:90vh;overflow:auto}
.lobby{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.qr{background:#fff;padding:12px;border-radius:14px;width:max-content}
.qr img,.qr canvas{display:block;width:200px;height:200px}
.url{font-size:clamp(18px,2.4vw,26px);font-weight:700;overflow-wrap:anywhere}
.joined{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.joined li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;background:var(--line)}
.team small{display:block;font-size:12px;opacity:.85}
@media(max-width:600px){.lobby{grid-template-columns:minmax(0,1fr)}}
.pill{background:rgba(255,255,255,.15);color:var(--on);border-radius:99px;padding:6px 14px;font-weight:700;white-space:nowrap}
.pass{background:var(--card);border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.3);position:relative;overflow:hidden}
.pass::before,.pass::after{content:"";position:absolute;top:118px;width:28px;height:28px;border-radius:50%;background:var(--bg)}
.pass::before{left:-14px}.pass::after{right:-14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 28px;height:132px;border-bottom:2px dashed var(--line)}
.route{display:flex;align-items:center;gap:12px;flex:1}
.code{font-family:"Big Shoulders Display",sans-serif;font-size:44px;font-weight:900}
.route svg{flex:1;height:30px;max-width:260px}
.meta{text-align:right;color:var(--mute);font-size:14px}
.meta b{display:block;color:var(--ink);font-size:18px}
.body{padding:24px 28px 28px}
.q{font-size:clamp(24px,3.4vw,38px);font-weight:700;line-height:1.2;margin:0 0 22px;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{font:inherit;color:var(--ink);background:transparent;text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-size:clamp(17px,2vw,22px);font-weight:500;min-height:64px}
.opt i{font-style:normal;flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--line);font-weight:700}
.opt svg{flex:none;width:42px;height:28px;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.right i{background:var(--ok);color:#fff}
.opt.dim{opacity:.4}
.opt.wrong{border-color:#e11d48;background:color-mix(in srgb,#e11d48 12%,transparent);opacity:1}
.opt.wrong i{background:#e11d48;color:#fff}
.opt:not(.right):not(.wrong):not(.dim):hover{border-color:var(--acc)}
.opt:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.timer{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:0 0 20px}
.timer div{height:100%;background:var(--acc);width:100%;transition:width 1s linear}
.fact{margin-top:18px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--acc) 12%,transparent)}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:20px}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:12px 22px;min-height:48px;font-weight:700;font-size:17px;background:var(--accd);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,.team:focus-visible,.tab:focus-visible,input:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:18px}
.team{border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:var(--on);border-radius:14px;padding:10px 14px;text-align:left;min-height:64px}
.team b{display:block;font-size:15px;font-weight:500;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team span{font-family:"Big Shoulders Display",sans-serif;font-size:30px;font-weight:900}
.team.on{background:var(--acc);color:#0f1c15;border-color:var(--acc)}
.hint{color:rgba(255,255,255,.75);font-size:14px;margin-top:8px}
label.l{display:block;font-weight:700;margin:14px 0 6px}
input{font:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);min-height:48px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.logo-up{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding:14px;border:2px dashed var(--line);border-radius:14px}
.logo-up img{height:44px;max-width:200px;object-fit:contain}
.board{list-style:none;padding:0;margin:0}
.board li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:20px}
.board .n{font-family:"Big Shoulders Display",sans-serif;font-size:32px;font-weight:900;width:40px;color:var(--mute)}
.board .s{margin-left:auto;font-weight:700;white-space:nowrap}
.board li:first-child .n{color:var(--accd)}
.flagbig{width:min(300px,80%);height:auto;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin:10px auto 18px;display:block}
.recap{text-align:left;margin:18px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.recap li{padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--acc) 10%,transparent)}
.recap small{color:var(--mute);display:block}
.cl-logo{display:flex;justify-content:center;margin-bottom:8px}
.cl-logo img{max-height:80px;max-width:min(360px,80%);object-fit:contain}
.cl-logo .ph{border:2px dashed var(--line);border-radius:12px;padding:14px 20px;color:var(--mute);font-size:14px}
.cluster{width:100%;height:auto;display:block}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.tab{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:8px 16px;min-height:44px;font-weight:700}
.tab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;margin-top:10px;font-weight:500}
.legend span{display:flex;align-items:center;gap:8px;white-space:nowrap}
.legend svg{width:30px;height:20px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.tile{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.stamp{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.tile{transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){.stamp,.tile{animation:none}.timer div{transition:none}}
@media(max-width:600px){.opts{grid-template-columns:minmax(0,1fr)}.head{padding:16px 18px;height:110px}.pass::before,.pass::after{top:96px}.body{padding:18px}.code{font-size:32px}.meta b{font-size:15px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="f-fr" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><rect width="100" height="200" fill="#0055A4"/><rect x="100" width="100" height="200" fill="#fff"/><rect x="200" width="100" height="200" fill="#EF4135"/></symbol>

<symbol id="f-jo" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><rect width="300" height="67" fill="#000"/><rect y="67" width="300" height="66" fill="#fff"/><rect y="133" width="300" height="67" fill="#007A3D"/><polygon points="0,0 150,100 0,200" fill="#CE1126"/><polygon points="52.0,83.0 55.5,92.8 65.3,89.4 59.8,98.2 68.6,103.8 58.3,105.0 59.4,115.3 52.0,108.0 44.6,115.3 45.7,105.0 35.4,103.8 44.2,98.2 38.7,89.4 48.5,92.8" fill="#fff"/></symbol>
<symbol id="f-za" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><rect width="300" height="100" fill="#E03C31"/><rect y="100" width="300" height="100" fill="#001489"/><path d="M0 0 L150 100 L0 200 M150 100 H300" fill="none" stroke="#fff" stroke-width="67"/><path d="M0 0 L150 100 L0 200 M150 100 H300" fill="none" stroke="#007749" stroke-width="40"/><polygon points="0,24 114,100 0,176" fill="#FFB81C"/><polygon points="0,42 87,100 0,158" fill="#000"/></symbol>

<div class="wrap">
  <div class="top"><div class="brand" id="brand"><h1>World Quiz Run</h1></div><div class="host"><button class="hb" id="hbTeams" hidden>Teams</button><button class="hb" id="hbNal" hidden>NAL CLUSTER</button><span class="pill" id="prog">Check-in</span></div></div>
  <div class="ov" id="ov" hidden></div>
  <main id="app"></main>
  <div id="teams"></div>
</div>
<script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.2/firebase-database-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
{
const C={jo:"Jordan",ma:"Morocco",dz:"Algeria",fr:"France",za:"South Africa",eg:"Egypt",tr:"Turkey"};
const CODE={jo:"AMM",ma:"RBA",dz:"ALG",fr:"PAR",za:"CPT",eg:"CAI",tr:"IST"};
const Q=[
{c:"Landmarks",q:"The ancient rock-cut city of Petra is in which country?",a:"jo",f:"Petra is carved straight into rose-red sandstone cliffs."},
{c:"Sport",q:"Which country hosted the first FIFA World Cup in Africa, in 2010?",a:"za",f:"The final was played at Soccer City in Johannesburg."},
{c:"Geography",q:"Which is the largest country in Africa by area?",a:"dz",f:"It took the title after Sudan split in 2011."},
{c:"Landmarks",q:"The Hagia Sophia is in which country?",a:"tr",f:"It has stood in Istanbul for almost 1,500 years."},
{c:"Culture",q:"The Statue of Liberty was a gift to the USA from which country?",a:"fr",f:"It was designed by Frédéric Bartholdi, with a frame by Gustave Eiffel."},
{c:"Sport",q:"Which country was the first African team to reach a World Cup semi-final?",a:"ma",f:"Morocco did it at Qatar 2022."},
{c:"History",q:"The only surviving wonder of the Ancient World is in which country?",a:"eg",f:"The Great Pyramid of Giza is about 4,500 years old."},
{c:"Sport",q:"Which country won the 2019 Africa Cup of Nations?",a:"dz",f:"They beat Senegal 1–0 in the final in Cairo."},
{c:"Geography",q:"Which country has three capital cities?",a:"za",f:"Pretoria, Cape Town and Bloemfontein share the job."},
{c:"Geography",q:"Wadi Rum, the “Valley of the Moon”, is in which country?",a:"jo",f:"Many films set on Mars were shot in its red desert."},
{c:"Geography",q:"Istanbul is a city on two continents. Which country is it in?",a:"tr",f:"The Bosphorus splits the city between Europe and Asia."},
{c:"Sport",q:"The Tour de France cycling race is held in which country?",a:"fr",f:"It has been run almost every year since 1903."},
{c:"Tech",q:"Websites ending in “.dz” belong to which country?",a:"dz",f:"DZ comes from “Dzayer”, the local name for the country."},
{c:"Landmarks",q:"Chefchaouen, the famous “Blue City”, is in which country?",a:"ma",f:"Its streets and walls are painted every shade of blue."},
{c:"Geography",q:"The Suez Canal runs through which country?",a:"eg",f:"It opened in 1869 and links the Mediterranean and Red Seas."},
{c:"History",q:"Nelson Mandela became the first president of which country in 1994?",a:"za",f:"He had spent 27 years in prison before his election."},
{c:"Geography",q:"Which of these countries is on the shore of the Dead Sea?",a:"jo",f:"The Dead Sea shore is the lowest point on land on Earth."},
{c:"Music",q:"Raï music, made famous by Cheb Khaled, started in which country?",a:"dz",f:"Raï grew up in the port city of Oran."},
{c:"Landmarks",q:"Cappadocia, famous for sunrise hot-air balloons, is in which country?",a:"tr",f:"People once carved whole homes and churches into its rock towers."},
{c:"Geography",q:"Counting its territories, which country has the most time zones in the world?",a:"fr",f:"Thanks to its overseas territories, France spans 12 time zones."},
{c:"Culture",q:"The dirham is the currency of which of these countries?",a:"ma",f:"The UAE also uses a dirham, but it is a different currency."},
{c:"Sport",q:"Which country has won the most Africa Cup of Nations titles?",a:"eg",f:"Egypt has won the tournament seven times."},
{c:"History",q:"The Roman ruins of Timgad, called the “Pompeii of Africa”, are in which country?",a:"dz",f:"Timgad was founded by Emperor Trajan around 100 AD."},
{c:"Landmarks",q:"Table Mountain looks over which country's coast?",a:"za",f:"Its flat top towers over Cape Town."},
{c:"Geography",q:"Amman is the capital of which country?",a:"jo",f:"The city was first built on seven hills."},
{c:"Geography",q:"Ankara is the capital of which country?",a:"tr",f:"Istanbul is bigger, but Ankara has been the capital since 1923."},
{c:"Landmarks",q:"The Louvre, the world's most visited museum, is in which country?",a:"fr",f:"It is home to the Mona Lisa."},
{c:"Geography",q:"Which country is the only one that borders both Tunisia and Libya?",a:"dz",f:"It has seven neighbours in total."},
{c:"Geography",q:"Rabat is the capital of which country?",a:"ma",f:"Casablanca is bigger, but Rabat is the capital."},
{c:"History",q:"The temples of Abu Simbel are in which country?",a:"eg",f:"In the 1960s they were cut into blocks and moved to escape flooding from the High Dam."}
];
const KEYS=Object.keys(C);
const S={teams:[],i:0,secs:20,phase:"setup",opts:[],hit:new Set(),hits:[],t:null,left:0,logo:"",view:-1};
try{S.logo=localStorage.getItem("wqr-logo")||""}catch(e){}
/* Online mode: when served from Firebase Hosting with a Realtime Database, phones join at /play */
const NET={on:false,ref:null,ansRef:null};S.players={};S.ans={};
try{if(window.firebase&&firebase.apps&&firebase.apps.length&&firebase.database){NET.ref=firebase.database().ref("game");NET.on=true;
  NET.ref.child("players").on("value",sn=>{S.players=sn.val()||{};if(S.phase==="lobby")lobbyList()})}}catch(e){NET.on=false}
const put=o=>{if(NET.on)NET.ref.update(o).catch(()=>{})};
const pushScores=()=>put({scores:S.teams.map(t=>t.score),teams:S.teams.map(t=>t.name)});
const joinUrl=()=>location.origin+"/play";
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const flag=(k,cls)=>`<svg ${cls?`class="${cls}"`:""} viewBox="0 0 300 200" role="img" aria-label="Flag of ${C[k]}"><use href="#f-${k}"/></svg>`;
const plane=`<svg viewBox="0 0 200 30" aria-hidden="true"><path d="M4 15 H196" stroke="currentColor" stroke-width="2" stroke-dasharray="6 6" opacity=".35"/><path d="M92 15 l-10 -9 h5 l12 9 l-12 9 h-5z M99 15 h14 l4 -4 h4 l-2 4 l2 4 h-4 l-4 -4" fill="var(--acc)"/></svg>`;
const startT=()=>{stopT();S.t=setInterval(()=>{S.left--;$("#sec").textContent=Math.max(0,S.left)+"s";$("#tb").style.width=Math.max(0,S.left/S.secs*100)+"%";if(S.left<=0)reveal()},1000)};
const stopT=()=>{clearInterval(S.t);S.t=null};
const reset=()=>{S.teams.forEach(t=>{t.score=0;t.alg=0});S.hits=[];setup()};
function brand(){$("#brand").innerHTML=(S.logo?`<img src="${esc(S.logo)}" alt="Schneider Electric logo">`:"")+"<h1>World Quiz Run</h1>"}
function setup(){
  S.phase="setup";S.mid=false;hostBar();put({phase:"setup"});$("#prog").textContent="Check-in";brand();
  $("#app").innerHTML=`<section class="pass">
  <div class="head"><div class="route"><span class="code">CAI</span>${plane}<span class="code">???</span></div><div class="meta">30 questions · 7 countries<b>Around the cluster</b></div></div>
  <form class="body" id="f">
    <p class="q" style="margin-bottom:6px">Name your teams</p>
    <p style="color:var(--mute);margin:0">2 to 8 teams. Project this screen; the host taps the teams that got each answer right.</p>
    <div class="row" id="names"></div>
    <div class="bar">
      <button type="button" class="btn ghost" id="add">+ Add team</button>
      <label style="display:flex;align-items:center;gap:8px;font-weight:700">Seconds per question <input id="secs" type="number" min="5" max="90" value="${S.secs}" style="width:90px"></label>
    </div>
    <div class="logo-up">${S.logo?`<img src="${esc(S.logo)}" alt="Logo preview">`:""}<label class="btn ghost" for="lf" style="display:inline-flex;align-items:center">${S.logo?"Change":"Upload"} Schneider Electric logo</label><input id="lf" type="file" accept="image/*" style="display:none"><span style="color:var(--mute);font-size:14px">Shown on the top bar and the NAL CLUSTER finale.</span></div>
    <div class="bar"><span></span><button class="btn" type="submit">Board the flight</button></div>
  </form></section>`;
  const names=$("#names");let n=0;
  const add=v=>{if(n>=8)return;n++;names.insertAdjacentHTML("beforeend",`<div><label class="l" for="t${n}">Team ${n}</label><input id="t${n}" value="${esc(v||"Team "+n)}" maxlength="22"></div>`)};
  (S.teams.length?S.teams.map(t=>t.name):["Team 1","Team 2","Team 3","Team 4"]).forEach(add);
  $("#add").onclick=()=>add();
  $("#lf").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;try{localStorage.setItem("wqr-logo",S.logo)}catch(x){}setup()};r.readAsDataURL(file)};
  $("#f").onsubmit=e=>{e.preventDefault();
    const v=[...names.querySelectorAll("input")].map(x=>x.value.trim()).filter(Boolean).slice(0,8);
    if(v.length<2)return;
    S.teams=v.map(name=>({name,score:0,alg:0}));S.hits=[];S.secs=Math.max(5,Math.min(90,+$("#secs").value||20));S.i=0;
    if(NET.on){put({phase:"lobby",i:0,answers:null,correct:null,q:null});pushScores();lobby()}else question()};
  $("#teams").innerHTML="";
}
function lobby(){
  S.phase="lobby";hostBar();$("#prog").textContent="Boarding";
  $("#app").innerHTML=`<section class="pass">
  <div class="head"><div class="route"><span class="code">CAI</span>${plane}<span class="code">???</span></div><div class="meta">Players join<b>on their phones</b></div></div>
  <div class="body"><div class="lobby"><div class="qr" id="qr"></div>
    <div><p class="q" style="margin-bottom:8px">Scan to join your team</p><p style="margin:0;color:var(--mute)">Or open</p><p class="url">${esc(joinUrl())}</p><ul class="joined" id="joined"></ul></div></div>
    <div class="bar"><span style="color:var(--mute)">Several phones can join the same team. The first answer from each team counts.</span><button class="btn" id="go">Start the game</button></div>
  </div></section>`;
  try{new QRCode($("#qr"),{text:joinUrl(),width:200,height:200})}catch(e){$("#qr").remove()}
  lobbyList();$("#teams").innerHTML="";
  $("#go").onclick=question;
}
function lobbyList(){const el=$("#joined");if(!el)return;
  const n=S.teams.map(()=>0);Object.values(S.players).forEach(p=>{if(p&&n[p.team]!=null)n[p.team]++});
  el.innerHTML=S.teams.map((t,k)=>`<li><span>${esc(t.name)}</span><b>${n[k]} ${n[k]===1?"phone":"phones"}</b></li>`).join("")}
function teamStrip(clickable){
  $("#teams").innerHTML=`<div class="teams">${S.teams.map((t,k)=>`<button class="team${S.hit.has(k)?" on":""}" data-k="${k}" ${clickable?"":"disabled"} aria-pressed="${S.hit.has(k)}"><b>${esc(t.name)}</b><span>${t.score}</span>${NET.on&&S.phase==="q"?`<small>${S.ans["t"+k]?"Answered ✓":"Thinking…"}</small>`:NET.on&&S.phase==="r"&&S.ans["t"+k]?`<small>Picked ${C[S.ans["t"+k].pick]||"?"}</small>`:""}</button>`).join("")}</div>${clickable?`<p class="hint">${NET.on?"Teams that answered right on their phones are already marked. Tap to adjust, then press Next.":"Tap every team that answered correctly (or press 1–8), then press Next."}</p>`:""}`;
  if(clickable)document.querySelectorAll(".team").forEach(b=>b.onclick=()=>toggle(+b.dataset.k));
}
function toggle(k){S.hit.has(k)?S.hit.delete(k):S.hit.add(k);teamStrip(true)}
function question(){
  stopT();S.phase="q";hostBar();S.hit=new Set();
  const q=Q[S.i];
  let others=shuffle(KEYS.filter(k=>k!==q.a&&k!=="dz")).slice(0,3);
  if(q.a!=="dz"&&Math.random()<.6)others[0]="dz";
  S.opts=shuffle([q.a,...others]);
  $("#prog").textContent=`Flight ${S.i+1} / ${Q.length}`;
  $("#app").innerHTML=`<section class="pass">
  <div class="head"><div class="route"><span class="code">${S.i?CODE[Q[S.i-1].a]:"CAI"}</span>${plane}<span class="code">???</span></div><div class="meta">Category<b>${esc(q.c)}</b></div></div>
  <div class="body">
    <div class="timer"><div id="tb"></div></div>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${S.opts.map((o,k)=>`<button class="opt" data-o="${o}"><i>${"ABCD"[k]}</i>${flag(o)}${C[o]}</button>`).join("")}</div>
    <div id="fact"></div>
    <div class="bar"><span class="pill" style="background:var(--line);color:var(--ink)" id="sec">${S.secs}s</span><button class="btn" id="go">Reveal answer</button></div>
  </div></section>`;
  teamStrip(false);
  S.left=S.secs;startT();
  $("#go").onclick=()=>reveal();
  if(NET.on){
    S.ans={};if(NET.ansRef)NET.ansRef.off();
    put({phase:"q",i:S.i,correct:null,q:{text:q.q,c:q.c,opts:S.opts,n:Q.length,deadline:Date.now()+S.secs*1000}});
    NET.ansRef=NET.ref.child("answers/"+S.i);
    NET.ansRef.on("value",sn=>{S.ans=sn.val()||{};if(S.phase==="q"){teamStrip(false);const live=new Set(Object.values(S.players).map(p=>p&&p.team));const need=S.teams.map((t,k)=>k).filter(k=>live.has(k));if(need.length&&need.every(k=>S.ans["t"+k]))reveal()}});
    document.querySelectorAll(".opt").forEach(b=>{b.style.cursor="default"});
  }else document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>reveal(b.dataset.o));
}
function reveal(pick){
  if(S.phase!=="q")return;stopT();S.phase="r";
  const q=Q[S.i];
  document.querySelectorAll(".opt").forEach(e=>{e.classList.add(e.dataset.o===q.a?"right":e.dataset.o===pick?"wrong":"dim");e.onclick=null;e.style.cursor="default"});
  document.querySelector(".route .code:last-child").textContent=CODE[q.a];
  const verdict=pick?(pick===q.a?"Correct! ":`Not ${C[pick]} — it's `):"";
  $("#fact").innerHTML=`<div class="fact"><b>${verdict}${C[q.a]}.</b> ${esc(q.f)}</div>`;
  $("#tb").style.width="0%";
  const go=$("#go");go.textContent=S.i===Q.length-1?"Final results":"Next flight";go.onclick=next;
  if(NET.on){S.teams.forEach((t,k)=>{const a=S.ans["t"+k];if(a&&a.pick===q.a)S.hit.add(k)});put({phase:"r",correct:q.a})}
  teamStrip(true);
}
function next(){
  const q=Q[S.i];
  S.hits[S.i]=new Set(S.hit);
  S.hit.forEach(k=>{S.teams[k].score+=100;if(q.a==="dz")S.teams[k].alg++});
  pushScores();
  S.i++;
  if(S.i>=Q.length)return board(true);
  if(S.i%10===0)return board(false);
  question();
}
const ranked=()=>S.teams.map((t,k)=>({...t,k})).sort((a,b)=>b.score-a.score);
function board(final){
  stopT();S.phase="b";hostBar();put({phase:final?"final":"board"});S.hit=new Set();
  $("#prog").textContent=final?"Landed":"Layover";
  const r=ranked();
  $("#app").innerHTML=`<section class="pass">
  <div class="head"><div class="route"><span class="code">${final?"END":"STOP"}</span>${plane}<span class="code">${final?"ARR":"…"}</span></div><div class="meta">${final?"Final":"After "+S.i+" questions"}<b>Leaderboard</b></div></div>
  <div class="body">
    ${final?`<h2 class="big stamp" style="font-size:clamp(34px,5vw,52px);margin-bottom:12px">${esc(r[0].name)} win!</h2>`:""}
    <ol class="board">${r.map((t,n)=>`<li><span class="n">${n+1}</span>${esc(t.name)}<span class="s">${t.score} pts</span></li>`).join("")}</ol>
    <div class="bar"><button class="btn ghost" id="back">${final?"Play again":"Back to setup"}</button><button class="btn" id="go">${final?"One more thing…":"Continue"}</button></div>
  </div></section>`;
  teamStrip(false);
  $("#back").onclick=reset;
  $("#go").onclick=final?twist:question;
}
function twist(){
  S.phase="t";$("#prog").textContent="Hidden destination";put({phase:"final"});
  const al=Q.filter(q=>q.a==="dz");
  const best=ranked().sort((a,b)=>b.alg-a.alg)[0];
  $("#app").innerHTML=`<section class="pass" style="text-align:center">
  <div class="head"><div class="route"><span class="code">???</span>${plane}<span class="code">ALG</span></div><div class="meta">Hidden destination<b>Revealed</b></div></div>
  <div class="body">
    <p style="color:var(--mute);margin:0 0 6px">Did you notice?</p>
    <h2 class="big" style="font-size:clamp(32px,5vw,52px)">The answer was “Algeria” ${al.length} times today</h2>
    ${flag("dz","flagbig stamp")}
    <p style="max-width:60ch;margin:0 auto">Every flight kept landing in the same place.${best&&best.alg?` <b>${esc(best.name)}</b> spotted it most often (${best.alg} of ${al.length}).`:""}</p>
    <ul class="recap">${al.map(q=>`<li>${esc(q.q)}<small>${esc(q.f)}</small></li>`).join("")}</ul>
    <div class="bar" style="justify-content:center"><button class="btn" id="go">Show the NAL CLUSTER</button></div>
  </div></section>`;
  teamStrip(false);
  $("#go").onclick=()=>{S.view=-1;cluster()};
}
/* Each letter of NAL CLUSTER holds 3 questions as 3 flag bands.
   The letter is measured on a canvas so each band follows the letter's real ink
   and each flag is centred on the solid part of the letter in that band. */
const LET=[..."NALCLUSTER"],CW=1000/7,LW=134,FS=330,FONT="'Archivo Black',Impact,sans-serif";
const pos=n=>{const row=n<3?0:1,col=row?n-3:n,x0=row?0:(1000-3*CW)/2;return{cx:x0+col*CW+CW/2,base:row?530:255}};
function measure(){
  const geo=[];const cv=document.createElement("canvas");cv.width=300;cv.height=420;const x=cv.getContext("2d",{willReadFrequently:true});
  LET.forEach((ch,n)=>{
    const {cx,base}=pos(n);let g=null;
    try{
      x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,300,420);x.font=`${FS}px ${FONT}`;
      const m=x.measureText(ch),sx=LW/(m.width||LW);
      x.setTransform(sx,0,0,1,150,380);x.textAlign="center";x.fillStyle="#000";x.fillText(ch,0,0);
      const d=x.getImageData(0,0,300,420).data,ink=(px,py)=>d[(py*300+px)*4+3]>128;
      let y0=-1,y1=-1;for(let py=0;py<420;py++){for(let px=0;px<300;px++)if(ink(px,py)){if(y0<0)y0=py;y1=py;break}}
      if(y0>=0){
        const top=base-(380-y0),bot=base-(380-y1)+1,bh=(bot-top)/3,bands=[];
        for(let b=0;b<3;b++){let sum=0,cnt=0,l=300,r=0;
          for(let py=Math.round(y0+b*bh);py<Math.round(y0+(b+1)*bh);py++)for(let px=0;px<300;px++)if(ink(px,py)){sum+=px;cnt++;if(px<l)l=px;if(px>r)r=px}
          bands.push(cnt?{c:cx+sum/cnt-150,l:cx+l-150,r:cx+r-150+1}:{c:cx,l:cx-LW/2,r:cx+LW/2})}
        g={top,bh,bands};
      }
    }catch(e){}
    geo.push(g||{top:base-240,bh:80,bands:[0,1,2].map(()=>({c:cx,l:cx-LW/2,r:cx+LW/2}))});
  });
  return geo;
}
function cluster(){
  const mid=!!S.mid;
  if(!S.geo){S.geo="wait";const go=()=>{S.geo=measure();cluster()};
    (document.fonts&&document.fonts.load?document.fonts.load(`${FS}px 'Archivo Black'`,"NALCUSTER").catch(()=>{}):Promise.resolve()).then(go);return}
  if(S.geo==="wait")return;
  if(!mid)S.phase="c";$("#prog").textContent="NAL CLUSTER";hostBar();
  const got=i=>{const h=S.hits[i];if(!h)return false;return S.view<0?h.size>0:h.has(S.view)};
  let defs="",fill="",outl="",d=0;
  LET.forEach((ch,n)=>{
    const {cx,base}=pos(n),G=S.geo[n];
    const t=`<text x="${cx.toFixed(1)}" y="${base}" text-anchor="middle" font-family="${FONT}" font-size="${FS}" textLength="${LW}" lengthAdjust="spacingAndGlyphs">${ch}</text>`;
    defs+=`<clipPath id="c${n}">${t}</clipPath>`;outl+=t;
    let g="";
    G.bands.forEach((B,b)=>{
      const i=n*3+b,y=G.top+b*G.bh,h=G.bh-3,bx=cx-CW/2;
      if(!got(i)){g+=`<rect x="${bx.toFixed(1)}" y="${y.toFixed(1)}" width="${CW.toFixed(1)}" height="${h.toFixed(1)}" fill="var(--line)"/>`;return}
      const half=Math.max(B.c-B.l,B.r-B.c)+2,fh=Math.max(h,half*2/1.5),fw=fh*1.5;
      g+=`<svg class="tile" style="animation-delay:${d++*70}ms" x="${bx.toFixed(1)}" y="${y.toFixed(1)}" width="${CW.toFixed(1)}" height="${h.toFixed(1)}" overflow="hidden"><use href="#f-${Q[i].a}" x="${(B.c-fw/2-bx).toFixed(1)}" y="${((h-fh)/2).toFixed(1)}" width="${fw.toFixed(1)}" height="${fh.toFixed(1)}"/></svg>`;
    });
    fill+=`<g clip-path="url(#c${n})">${g}</g>`;
  });
  const count={};Q.forEach((q,i)=>{if(got(i))count[q.a]=(count[q.a]||0)+1});
  const total=Q.filter((q,i)=>got(i)).length;
  $("#app").innerHTML=`<section class="pass">
  <div class="body" style="text-align:center">
    <div class="cl-logo">${S.logo?`<img src="${esc(S.logo)}" alt="Schneider Electric logo">`:`<div class="ph">Upload the Schneider Electric logo on the setup screen to show it here</div>`}</div>
    <svg class="cluster" viewBox="0 0 1000 545" role="img" aria-label="NAL CLUSTER filled with ${total} earned flags">
      <defs>${defs}</defs>${fill}
      <g fill="none" stroke="var(--ink)" stroke-width="3" opacity=".5">${outl}</g>
    </svg>
    <div class="tabs"><button class="tab${S.view<0?" on":""}" data-v="-1">All teams</button>${S.teams.map((t,k)=>`<button class="tab${S.view===k?" on":""}" data-v="${k}">${esc(t.name)}</button>`).join("")}</div>
    <p style="margin:0;font-weight:700">${total} of ${Q.length} flags earned</p>
    <div class="legend">${KEYS.filter(k=>count[k]).map(k=>`<span>${flag(k)}${C[k]} × ${count[k]}</span>`).join("")}</div>
    <div class="bar" style="justify-content:center"><button class="btn ${mid?"":"ghost"}" id="back">${mid?"Back to game":"Play again"}</button></div>
  </div></section>`;
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.view=+b.dataset.v;cluster()});
  $("#back").onclick=mid?closeNal:reset;
  if(!mid)teamStrip(false);
}
/* Host controls: NAL CLUSTER peek and team editor, usable any time after setup */
function hostBar(){
  const on=S.phase!=="setup";$("#hbTeams").hidden=!on;$("#hbNal").hidden=!on||S.phase==="c";
  $("#hbNal").classList.toggle("on",!!S.mid);$("#hbNal").textContent=S.mid?"Hide NAL CLUSTER":"NAL CLUSTER";
}
function openNal(){
  if(S.phase==="setup"||S.phase==="c"||S.mid)return;
  stopT();S.mid=true;S.saveProg=$("#prog").textContent;
  S.saved=[...$("#app").childNodes];S.saved.forEach(n=>n.remove());
  S.savedT=[...$("#teams").childNodes];S.savedT.forEach(n=>n.remove());
  cluster();
}
function closeNal(){
  if(!S.mid)return;S.mid=false;
  $("#app").replaceChildren(...S.saved);$("#teams").replaceChildren(...S.savedT);
  $("#prog").textContent=S.saveProg;hostBar();
  if(S.phase==="q"&&S.left>0)startT();
}
function teamsEditor(){
  const ov=$("#ov");
  const draw=()=>{ov.innerHTML=`<section class="pass"><form class="body" id="tf">
    <p class="q" style="font-size:28px;margin-bottom:6px">Teams</p>
    <p style="color:var(--mute);margin:0">Rename teams or add new ones (up to 8). Scores are kept.</p>
    <div class="row">${S.teams.map((t,k)=>`<div><label class="l" for="e${k}">Team ${k+1} · ${t.score} pts</label><input id="e${k}" value="${esc(t.name)}" maxlength="22"></div>`).join("")}</div>
    <div class="bar"><button type="button" class="btn ghost" id="tadd" ${S.teams.length>=8?"disabled":""}>+ Add team</button>
    <span style="display:flex;gap:10px"><button type="button" class="btn ghost" id="tcan">Cancel</button><button class="btn">Save</button></span></div>
  </form></section>`;
    const keep=()=>S.teams.forEach((t,k)=>{const v=$("#e"+k).value.trim();if(v)t.name=v});
    $("#tadd").onclick=()=>{keep();if(S.teams.length<8){S.teams.push({name:"Team "+(S.teams.length+1),score:0,alg:0});draw()}};
    $("#tcan").onclick=()=>{ov.hidden=true};
    $("#tf").onsubmit=e=>{e.preventDefault();keep();ov.hidden=true;pushScores();if(S.phase==="lobby")lobbyList();
      if(S.mid)cluster();else if(S.phase==="c")cluster();else teamStrip(S.phase==="r")};
  };
  draw();ov.hidden=false;
}
$("#hbNal").onclick=()=>S.mid?closeNal():openNal();
$("#hbTeams").onclick=teamsEditor;
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||!$("#ov").hidden)return;
  if(e.key==="n"||e.key==="N"){S.mid?closeNal():openNal();return}
  if(e.key==="t"||e.key==="T"){if(S.phase!=="setup")teamsEditor();return}
  if(S.mid)return;
  if(e.key===" "||e.key==="Enter"){const g=$("#go");if(g){e.preventDefault();g.click()}}
  const n=parseInt(e.key,10);
  if(S.phase==="r"&&n>=1&&n<=S.teams.length)toggle(n-1);
});
setup();
}
</script>
</body>
</html>
