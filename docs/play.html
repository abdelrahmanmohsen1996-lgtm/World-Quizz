<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Quiz Run · Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#13261d,#0a140f);--card:light-dark(#fff,#15241c);--ink:light-dark(#0f1c15,#eaf5ee);--mute:light-dark(#5b6b62,#9fb3a7);--line:light-dark(#dfe8e2,#25392e);--acc:#3dcd58;--accd:#1f8f36;--bad:#e11d48}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;margin-bottom:14px}
.top h1{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:28px;margin:0;line-height:1}
.me{text-align:right;font-size:14px;opacity:.9}.me b{display:block;font-size:22px;font-family:"Big Shoulders Display",Impact,sans-serif;opacity:1}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 14px 30px rgba(0,0,0,.3)}
h2{font-size:24px;line-height:1.2;margin:0 0 14px;text-wrap:balance}
p{margin:0 0 10px}.mute{color:var(--mute)}
button{font:inherit;cursor:pointer}
.pick{display:block;width:100%;text-align:left;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:14px 16px;min-height:56px;font-size:19px;font-weight:700;margin-bottom:10px}
.pick:focus-visible,.opt:focus-visible,.link:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:12px 14px;min-height:64px;font-size:19px;font-weight:700;margin-bottom:10px;text-align:left}
.opt i{font-style:normal;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--line);flex:none}
.opt svg{width:42px;height:28px;border-radius:4px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.opt.sel{border-color:var(--accd);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.opt.right{border-color:var(--accd);background:color-mix(in srgb,var(--acc) 20%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.opt:disabled{cursor:default}.opt.dim{opacity:.4}
.timer{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}.timer div{height:100%;background:var(--acc);width:100%}
.tag{display:inline-block;background:var(--line);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:700;margin-bottom:10px}
.big{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:56px;line-height:1;margin:8px 0}
.ok{color:var(--accd)}.no{color:var(--bad)}
.link{background:none;border:0;color:#fff;text-decoration:underline;padding:12px 0;min-height:44px;opacity:.85}
.center{text-align:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="f-fr" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><rect width="100" height="200" fill="#0055A4"/><rect x="100" width="100" height="200" fill="#fff"/><rect x="200" width="100" height="200" fill="#EF4135"/></symbol>
<symbol id="f-tr" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><mask id="m-tr"><rect width="300" height="200" fill="#fff"/><circle cx="125" cy="100" r="40" fill="#000"/></mask><rect width="300" height="200" fill="#E30A17"/><circle cx="112" cy="100" r="50" fill="#fff" mask="url(#m-tr)"/><polygon points="148.0,100.0 164.3,94.4 164.6,77.2 174.9,91.0 191.4,85.9 181.5,100.0 191.4,114.1 174.9,109.0 164.6,122.8 164.3,105.6" fill="#fff"/></symbol>
<symbol id="f-ma" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><rect width="300" height="200" fill="#C1272D"/><polygon points="150.0,45.0 182.3,144.5 97.7,83.0 202.3,83.0 117.7,144.5" fill="none" stroke="#006233" stroke-width="7" stroke-linejoin="miter"/></symbol>
<symbol id="f-dz" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><mask id="m-dz"><rect width="300" height="200" fill="#fff"/><circle cx="162.5" cy="100" r="40" fill="#000"/></mask><rect width="150" height="200" fill="#006233"/><rect x="150" width="150" height="200" fill="#fff"/><circle cx="150" cy="100" r="50" fill="#D21034" mask="url(#m-dz)"/><polygon points="174.8,79.1 174.9,95.0 190.0,100.0 174.9,105.0 174.8,120.9 165.4,108.1 150.2,112.9 159.5,100.0 150.2,87.1 165.4,91.9" fill="#D21034"/></symbol>
<symbol id="f-eg" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><rect width="300" height="67" fill="#CE1126"/><rect y="67" width="300" height="66" fill="#fff"/><rect y="133" width="300" height="67" fill="#000"/><g fill="#C09300"><path d="M150 76 c-4 0-6 4-6 7 l-18 6 l14 3 l-10 6 l16-2 l2 18 h4 l2-18 l16 2 l-10-6 l14-3 l-18-6 c0-3-2-7-6-7z"/><rect x="141" y="117" width="18" height="5" rx="1"/></g></symbol>
<symbol id="f-jo" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><rect width="300" height="67" fill="#000"/><rect y="67" width="300" height="66" fill="#fff"/><rect y="133" width="300" height="67" fill="#007A3D"/><polygon points="0,0 150,100 0,200" fill="#CE1126"/><polygon points="52.0,83.0 55.5,92.8 65.3,89.4 59.8,98.2 68.6,103.8 58.3,105.0 59.4,115.3 52.0,108.0 44.6,115.3 45.7,105.0 35.4,103.8 44.2,98.2 38.7,89.4 48.5,92.8" fill="#fff"/></symbol>
<symbol id="f-za" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"><rect width="300" height="100" fill="#E03C31"/><rect y="100" width="300" height="100" fill="#001489"/><path d="M0 0 L150 100 L0 200 M150 100 H300" fill="none" stroke="#fff" stroke-width="67"/><path d="M0 0 L150 100 L0 200 M150 100 H300" fill="none" stroke="#007749" stroke-width="40"/><polygon points="0,24 114,100 0,176" fill="#FFB81C"/><polygon points="0,42 87,100 0,158" fill="#000"/></symbol>
</defs></svg>
<div class="wrap">
  <div class="top"><h1>World Quiz Run</h1><div class="me" id="me"></div></div>
  <main class="card" id="app"><p class="mute">Connecting…</p></main>
  <div class="center"><button class="link" id="change" hidden>Change team</button></div>
</div>
<script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.2/firebase-database-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script>
{
const C={jo:"Jordan",ma:"Morocco",dz:"Algeria",fr:"France",za:"South Africa",eg:"Egypt",tr:"Turkey"};
const KEYS=Object.keys(C);
const Q=[
{c:"Landmarks",q:"The ancient rock-cut city of Petra is in which country?",a:"jo",f:"Petra is carved straight into rose-red sandstone cliffs."},
{c:"Sport",q:"Which country hosted the first FIFA World Cup in Africa, in 2010?",a:"za",f:"The final was played at Soccer City in Johannesburg."},
{c:"Geography",q:"Which is the largest country in Africa by area?",a:"dz",f:"It took the title after Sudan split in 2011."},
{c:"Landmarks",q:"The Hagia Sophia is in which country?",a:"tr",f:"It has stood in Istanbul for almost 1,500 years."},
{c:"Culture",q:"The Statue of Liberty was a gift to the USA from which country?",a:"fr",f:"It was designed by Frédéric Bartholdi, with a frame by Gustave Eiffel."},
{c:"Sport",q:"Which country was the first African team to reach a World Cup semi-final?",a:"ma",f:"Morocco did it at Qatar 2022."},
{c:"History",q:"The only surviving wonder of the Ancient World is in which country?",a:"eg",f:"The Great Pyramid of Giza is about 4,500 years old."},
{c:"Sport",q:"Which country won the 2019 Africa Cup of Nations?",a:"dz",f:"They beat Senegal 1–0 in the final in Cairo."},
{c:"Geography",q:"Which country has three capital cities?",a:"za",f:"Pretoria, Cape Town and Bloemfontein share the job."},
{c:"Geography",q:"Wadi Rum, the “Valley of the Moon”, is in which country?",a:"jo",f:"Many films set on Mars were shot in its red desert."},
{c:"Geography",q:"Istanbul is a city on two continents. Which country is it in?",a:"tr",f:"The Bosphorus splits the city between Europe and Asia."},
{c:"Sport",q:"The Tour de France cycling race is held in which country?",a:"fr",f:"It has been run almost every year since 1903."},
{c:"Tech",q:"Websites ending in “.dz” belong to which country?",a:"dz",f:"DZ comes from “Dzayer”, the local name for the country."},
{c:"Landmarks",q:"Chefchaouen, the famous “Blue City”, is in which country?",a:"ma",f:"Its streets and walls are painted every shade of blue."},
{c:"Geography",q:"The Suez Canal runs through which country?",a:"eg",f:"It opened in 1869 and links the Mediterranean and Red Seas."},
{c:"History",q:"Nelson Mandela became the first president of which country in 1994?",a:"za",f:"He had spent 27 years in prison before his election."},
{c:"Geography",q:"Which of these countries is on the shore of the Dead Sea?",a:"jo",f:"The Dead Sea shore is the lowest point on land on Earth."},
{c:"Music",q:"Raï music, made famous by Cheb Khaled, started in which country?",a:"dz",f:"Raï grew up in the port city of Oran."},
{c:"Landmarks",q:"Cappadocia, famous for sunrise hot-air balloons, is in which country?",a:"tr",f:"People once carved whole homes and churches into its rock towers."},
{c:"Geography",q:"Counting its territories, which country has the most time zones in the world?",a:"fr",f:"Thanks to its overseas territories, France spans 12 time zones."},
{c:"Culture",q:"The dirham is the currency of which of these countries?",a:"ma",f:"The UAE also uses a dirham, but it is a different currency."},
{c:"Sport",q:"Which country has won the most Africa Cup of Nations titles?",a:"eg",f:"Egypt has won the tournament seven times."},
{c:"History",q:"The Roman ruins of Timgad, called the “Pompeii of Africa”, are in which country?",a:"dz",f:"Timgad was founded by Emperor Trajan around 100 AD."},
{c:"Landmarks",q:"Table Mountain looks over which country's coast?",a:"za",f:"Its flat top towers over Cape Town."},
{c:"Geography",q:"Amman is the capital of which country?",a:"jo",f:"The city was first built on seven hills."},
{c:"Geography",q:"Ankara is the capital of which country?",a:"tr",f:"Istanbul is bigger, but Ankara has been the capital since 1923."},
{c:"Landmarks",q:"The Louvre, the world's most visited museum, is in which country?",a:"fr",f:"It is home to the Mona Lisa."},
{c:"Geography",q:"Which country is the only one that borders both Tunisia and Libya?",a:"dz",f:"It has seven neighbours in total."},
{c:"Geography",q:"Rabat is the capital of which country?",a:"ma",f:"Casablanca is bigger, but Rabat is the capital."},
{c:"History",q:"The temples of Abu Simbel are in which country?",a:"eg",f:"In the 1960s they were cut into blocks and moved to escape flooding from the High Dam."}
];
const PTS=[100,70,40,20],PAL=["#2563eb","#db2777","#d97706","#7c3aed","#0891b2","#ea580c","#4d7c0f","#475569"];
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const optsFor=i=>{const r=rng(i*7919+13),sh=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(r()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};
  const a=Q[i].a;let o=sh(KEYS.filter(k=>k!==a&&k!=="dz")).slice(0,3);if(a!=="dz"&&r()<.6)o[0]="dz";return sh([a,...o])};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const flag=k=>C[k]?`<svg viewBox="0 0 300 200" aria-hidden="true"><use href="#f-${k}"/></svg>`:"";
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let pid=store.get("wqr-pid");if(!pid){pid=Math.random().toString(36).slice(2,10);store.set("wqr-pid",pid)}
let team=store.get("wqr-team");team=team==null?null:+team;
let G={},myAns=null,ansRef=null,tick=null,prevIdx=null,flash=null,flashT=null;
if(!(window.firebase&&firebase.apps&&firebase.apps.length)){$("#app").innerHTML='<h2>Not connected</h2><p class="mute">Open this page from the game link the host shows on screen.</p>';}
else{
const ref=firebase.database().ref("game");
const meRef=ref.child("players/"+pid);
ref.on("value",sn=>{G=sn.val()||{};
  const teams=G.teams||[];
  if(team!=null&&(team>=teams.length)){team=null;store.set("wqr-team",null)}
  if(team!=null){meRef.set({team});meRef.onDisconnect().remove()}
  watchAns();render();
});
function watchAns(){
  const key=G.phase==="q"||G.phase==="r"?G.i:null;
  if(ansRef&&ansRef._k===key)return;
  if(ansRef)ansRef.off();ansRef=null;myAns=null;
  if(key==null||team==null)return;
  ansRef=ref.child("answers/"+key+"/t"+team);ansRef._k=key;
  ansRef.on("value",sn=>{myAns=sn.val();render()});
}
function choose(k){team=k;store.set("wqr-team",k);meRef.set({team:k});meRef.onDisconnect().remove();ansRef&&ansRef.off();ansRef=null;watchAns();render()}
function answer(o){
  if(G.phase!=="q"||myAns||team==null)return;
  if(G.q&&Date.now()>G.q.deadline+1500)return;
  ref.child("answers/"+G.i+"/t"+team).transaction(cur=>cur?undefined:{pick:o,by:pid,t:Date.now()});
}
const myState=()=>((G.state||{})["t"+team])||{};
const myList=()=>Q.map((q,i)=>i).filter(i=>i%(G.N||1)===team);
function answerLive(o){
  const st=myState(),idx=st.idx||0,list=myList();if(idx>=list.length)return;
  const i=list[idx];if((st.wrong||{})[o])return;
  ref.child("state/t"+team).transaction(cur=>{
    cur=cur||{idx:0,score:0};if((cur.idx||0)!==idx)return;
    if(o===Q[i].a){const tries=Object.keys(cur.wrong||{}).length,pts=PTS[Math.min(tries,3)];
      return{idx:idx+1,score:(cur.score||0)+pts,wrong:null,last:{i,pts,by:pid}}}
    const w=Object.assign({},cur.wrong||{});w[o]=true;return Object.assign({},cur,{wrong:w});
  });
}
$("#change").onclick=()=>{team=null;store.set("wqr-team",null);meRef.remove();render()};
function render(){
  clearInterval(tick);
  const teams=G.teams||[],scores=G.scores||[];
  if(G.phase==="live"&&team!=null){const st=myState(),idx=st.idx||0;
    if(prevIdx!=null&&idx>prevIdx&&st.last){flash=st.last;clearTimeout(flashT);flashT=setTimeout(()=>{flash=null;render()},1800)}
    prevIdx=idx}else prevIdx=null;
  const myPts=G.phase==="live"?(myState().score||0):(scores[team]||0);
  $("#me").innerHTML=team!=null&&teams[team]?`${esc(teams[team])}<b>${myPts} pts</b>`:"";
  $("#change").hidden=team==null||!(G.phase==="lobby"||G.phase==="setup");
  const A=$("#app"),prevH=A._h;A._h=null;
  if(!teams.length||G.phase==="setup"){A.innerHTML='<h2>Waiting for the host</h2><p class="mute">The game will appear here as soon as the host sets up the teams.</p>';return}
  if(team==null){A.innerHTML=`<h2>Choose your team</h2>${teams.map((t,k)=>`<button class="pick" data-k="${k}">${esc(t)}</button>`).join("")}`;
    A.querySelectorAll(".pick").forEach(b=>b.onclick=()=>choose(+b.dataset.k));return}
  if(G.phase==="lobby"){A.innerHTML=`<p class="tag">You're in</p><h2>${esc(teams[team])}</h2><p class="mute">Get ready. When the host starts, your team's questions appear here. Keep trying until you get each one right to reveal your flags.</p>`;return}
  if(G.phase==="live"){
    const st=myState(),idx=st.idx||0,list=myList(),wrong=st.wrong||{};
    if(flash){const q=Q[flash.i];A.innerHTML=`<div class="center"><p class="tag">Flag revealed!</p>${flag(q.a).replace("<svg",'<svg style="width:180px;height:120px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.2)"')}<p class="big ok">+${flash.pts}</p><p><b>${esc(C[q.a])}.</b> ${esc(q.f)}</p></div>`;return}
    if(idx>=list.length){A.innerHTML=`<div class="center"><p class="tag">All done</p><p class="big ok">${st.score||0} pts</p><h2>All your team's flags are in the NAL CLUSTER</h2><p class="mute">Watch the big screen while the other teams finish.</p></div>`;return}
    const i=list[idx],q=Q[i],tries=Object.keys(wrong).length;
    const html=`<p class="tag">${esc(q.c)} · Question ${idx+1} of ${list.length}</p><h2>${esc(q.q)}</h2>
      ${optsFor(i).map((o,k)=>`<button class="opt ${wrong[o]?"wrong":""}" data-o="${o}" ${wrong[o]?"disabled":""}><i>${"ABCD"[k]}</i>${flag(o)}${esc(C[o])}</button>`).join("")}
      <p class="center" style="margin-top:6px">${tries?`<b class="no">Not quite. Try again!</b><br><span class="mute">Worth ${PTS[Math.min(tries,3)]} pts now</span>`:`<span class="mute">Get it right to reveal your flag · ${PTS[0]} pts</span>`}</p>`;
    if(prevH===html){A._h=html;return}
    A.innerHTML=html;A._h=html;
    A.querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>answerLive(b.dataset.o));
    return}
  if((G.phase==="q"||G.phase==="r")&&G.q){
    const q=G.q,mine=myAns&&myAns.pick,rev=G.phase==="r";
    A.innerHTML=`<p class="tag">${esc(q.c)} · ${(G.i||0)+1}/${q.n}</p>${rev?"":`<div class="timer"><div id="tb"></div></div>`}<h2>${esc(q.text)}</h2>
      ${(q.opts||[]).map((o,k)=>{let c="";if(rev){c=o===G.correct?"right":o===mine?"wrong":"dim"}else if(o===mine)c="sel";
        return `<button class="opt ${c}" data-o="${esc(o)}" ${mine||rev?"disabled":""}><i>${"ABCD"[k]}</i>${flag(o)}${esc(C[o]||o)}</button>`}).join("")}
      <p class="center" style="margin-top:6px">${rev?(mine?(mine===G.correct?'<b class="ok">Correct! +100</b>':`<b class="no">Not this time — it was ${esc(C[G.correct])}</b>`):`<b class="no">No answer — it was ${esc(C[G.correct])}</b>`)
        :mine?(myAns.by===pid?"Answer locked in for your team.":"A teammate locked in this answer."):'<span class="mute">First answer from your team counts.</span>'}</p>`;
    A.querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>answer(b.dataset.o));
    if(!rev){const secs=Math.max(1,(q.deadline-Date.now())/1000),tot=secs;const tb=$("#tb");
      const up=()=>{const left=(q.deadline-Date.now())/1000;if(tb)tb.style.width=Math.max(0,Math.min(100,left/ (tot||1)*100))+"%";if(left<=0)clearInterval(tick)};up();tick=setInterval(up,250)}
    return}
  const rank=scores.map((s,k)=>({s,k})).sort((a,b)=>b.s-a.s).findIndex(r=>r.k===team)+1;
  A.innerHTML=`<div class="center"><p class="tag">${G.phase==="final"?"Final":"Leaderboard"}</p><p class="big">#${rank||"–"}</p><p><b>${esc(teams[team])}</b> · ${scores[team]||0} pts</p><p class="mute">Look at the big screen!</p></div>`;
}
}
}
</script>
</body>
</html>
